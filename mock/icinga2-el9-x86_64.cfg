## Standalone mock chroot configuration used to rebuild the Icinga 2 SRPM
## against a genuine EL9-compatible (AlmaLinux 9) userland.
##
## Rationale for AlmaLinux 9 as the build root:
##   - 1:1 binary compatible rebuild of RHEL 9 (ABI/package parity), actively
##     maintained, and produces packages that install cleanly on RHEL 9,
##     Rocky Linux 9 and AlmaLinux 9 alike.
##   - Ships official mirrors that are fast and reliable for CI use.
##   - Rocky Linux 9 would work equally well; either is acceptable. AlmaLinux
##     was chosen for this repository for its mirror stability in CI.
##
## This config intentionally does NOT rely on mock-core-configs templates
## shipped by the distro, so the build is fully reproducible from the
## contents of this repository.

config_opts['root'] = 'icinga2-el9-x86_64'
config_opts['target_arch'] = 'x86_64'
config_opts['legal_host_arches'] = ('x86_64',)
config_opts['chroot_setup_cmd'] = 'install @buildsys-build rpm-build dnf dnf-plugins-core redhat-rpm-config'
config_opts['dist'] = 'el9'
config_opts['releasever'] = '9'
config_opts['package_manager'] = 'dnf'
# Bootstrap chroot is built via dnf --installroot using the repos defined
# below (not a container image), so no nested docker/podman is required
# inside the GitHub Actions job container.
config_opts['use_bootstrap'] = True
config_opts['use_bootstrap_image'] = False
config_opts['nosync'] = True
config_opts['rpmbuild_networking'] = False
config_opts['use_host_resolv'] = True
config_opts['print_main_output'] = True

config_opts['plugin_conf']['ccache_enable'] = False
config_opts['plugin_conf']['bind_mount_enable'] = True
config_opts['plugin_conf']['bind_mount_opts'] = {
    'dirs': [],
    'create_dirs': False,
}

config_opts['macros']['%_disable_source_fetch'] = '0'
config_opts['macros']['%_topdir'] = '/builddir/build'
config_opts['macros']['%dist'] = '.el9'
config_opts['macros']['%rhel'] = '9'
config_opts['macros']['%el9'] = '1'

# Repositories are pinned to AlmaLinux 9 + EPEL 9 + CRB only.
# GPG checking is enabled; keys are read from the distribution-gpg-keys
# package that must be installed on the mock host (from EPEL 9).
config_opts['dnf.conf'] = """
[main]
keepcache=0
debuglevel=1
reposdir=/dev/null
logfile=/var/log/yum.log
retries=20
obsoletes=1
gpgcheck=1
assumeyes=1
syslog_ident=mock
syslog_device=
metadata_expire=0
mdpolicy=group:primary
best=1
install_weak_deps=0
protected_packages=
user_agent={{ user_agent }}

[baseos]
name=AlmaLinux 9 - BaseOS
baseurl=https://repo.almalinux.org/almalinux/9/BaseOS/x86_64/os/
gpgkey=file:///usr/share/distribution-gpg-keys/alma/RPM-GPG-KEY-AlmaLinux-9
gpgcheck=1
enabled=1

[appstream]
name=AlmaLinux 9 - AppStream
baseurl=https://repo.almalinux.org/almalinux/9/AppStream/x86_64/os/
gpgkey=file:///usr/share/distribution-gpg-keys/alma/RPM-GPG-KEY-AlmaLinux-9
gpgcheck=1
enabled=1

[crb]
name=AlmaLinux 9 - CRB
baseurl=https://repo.almalinux.org/almalinux/9/CRB/x86_64/os/
gpgkey=file:///usr/share/distribution-gpg-keys/alma/RPM-GPG-KEY-AlmaLinux-9
gpgcheck=1
enabled=1

[epel]
name=Extra Packages for Enterprise Linux 9 - x86_64
baseurl=https://dl.fedoraproject.org/pub/epel/9/Everything/x86_64/
gpgkey=file:///usr/share/distribution-gpg-keys/epel/RPM-GPG-KEY-EPEL-9
gpgcheck=1
enabled=1
"""
